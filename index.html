<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACONG BOT</title>

    <!-- ⚡ Anti-flicker dark theme: jalan SEBELUM render -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            // Default dark kecuali user udah set light
            if (saved !== 'light') {
                document.documentElement.classList.add('dark-preload');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="./foto/mlbb.png">
    <link rel="icon" type="image/png" href="./foto/mlbb.png">
    <link rel="apple-touch-icon" href="./foto/mlbb.png">
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <div class="logo">
                    <a href="#" class="logo-link" title="ACONG BOT">
                        <img src="./foto/image.png" alt="Logo" width="40" height="40" loading="lazy">
                    </a>
                    <h1>Acong BOT</h1>
                </div>
            </div>
            <div class="nav-controls">
                <div class="search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari template...">
                </div>
                <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">

        <!-- Quick Actions -->
        <section class="quick-actions-section">
            <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
            <div class="quick-group">
                <div class="quick-group-label quick-group-order">Order</div>
                <div class="quick-actions">
                    <button class="quick-btn" data-template="order"><i
                            class="fas fa-shopping-cart"></i><span>Order</span></button>
                    <button class="quick-btn qris-btn" data-template="qris"><img src="foto/qr.png" alt="QRIS"
                            class="qris-logo" loading="lazy"><span>QRIS</span></button>
                    <button class="quick-btn" data-template="kirimuser"><i class="fas fa-paper-plane"></i><span>Kirim
                            Username</span></button>
                    <button class="quick-btn" data-template="linkgc"><i class="fas fa-comments"></i><span>Link
                            Grup</span></button>
                </div>
            </div>
        </section>

        <!-- Templates Section -->
        <section class="templates-section">
            <div class="templates-header">
                <h3><i class="fas fa-copy"></i> Semua Template</h3>
                <div class="templates-controls">
                    <div class="templates-count"><span id="templateCount">0</span> template tersedia</div>
                    <button class="toggle-all-btn" id="toggleAllBtn"><i
                            class="fas fa-eye"></i><span>Tampilkan</span></button>
                </div>
            </div>

            <!-- Filter bar: muncul saat grid dibuka -->
            <div class="template-filter-bar" id="templateFilterBar" style="display:none;">
                <div class="tmpl-search-wrap">
                    <i class="fas fa-search tmpl-search-icon"></i>
                    <input type="text" id="templateSearchInline" class="tmpl-search-input"
                        placeholder="Cari template...">
                </div>
                <div class="tmpl-cat-pills" id="tmplCatPills">
                    <button class="tmpl-pill active" data-cat="all">Semua</button>
                    <button class="tmpl-pill" data-cat="order">Order</button>
                    <button class="tmpl-pill" data-cat="problem">Problem</button>
                    <button class="tmpl-pill" data-cat="other">Lainnya</button>
                </div>
            </div>

            <div class="templates-grid hidden" id="templatesGrid"></div>
            <div class="tmpl-empty" id="tmplEmpty" style="display:none;">
                <i class="fas fa-search"></i>
                <p>Gak ada template yang cocok.</p>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>© Created by Dits</p>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>

</html>
